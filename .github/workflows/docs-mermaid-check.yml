name: Documentation Mermaid Validation

# Documentation-only workflow — independent of application build/test
# workflows. Parses every fenced ```mermaid block in the repository to
# confirm it is syntactically valid, without rendering or publishing
# anything.
on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch: {}

jobs:
  mermaid-validate:
    name: validate mermaid blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Extract and validate every mermaid block
        run: python3 scripts/ci/validate-mermaid-blocks.py
