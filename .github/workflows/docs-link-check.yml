name: Documentation Link Check

# Documentation-only workflow — independent of application build/test
# workflows. Validates both relative (in-repository) links and external
# URLs referenced from Markdown.
on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch: {}

jobs:
  lychee:
    name: lychee link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --exclude-loopback
            --exclude-file .lycheeignore
            --accept 200,204,301,302,403,429
            '**/*.md'
          fail: true
